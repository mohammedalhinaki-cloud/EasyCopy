name: Build Easy Copy APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle offline Arabic and English OCR models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/tessdata
          curl --fail --location --retry 4 --silent --show-error \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/ara.traineddata" \
            -o app/src/main/assets/tessdata/ara.traineddata
          curl --fail --location --retry 4 --silent --show-error \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/eng.traineddata" \
            -o app/src/main/assets/tessdata/eng.traineddata
          # Official high-accuracy Arabic script model, not the small Latin OCR.
          curl --fail --location --retry 4 --silent --show-error \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/script/Arabic.traineddata" \
            -o app/src/main/assets/tessdata/Arabic.traineddata
          test "$(stat -c%s app/src/main/assets/tessdata/Arabic.traineddata)" -gt 1000000
          test "$(stat -c%s app/src/main/assets/tessdata/ara.traineddata)" -gt 100000
          test "$(stat -c%s app/src/main/assets/tessdata/eng.traineddata)" -gt 100000
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify built APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyCopy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
